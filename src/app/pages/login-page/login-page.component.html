<div
    class="login-area"
    [class.dark-login-area]="themeService.isDark()"
>
    <div class="row m-0">
        <div class="col-lg-6 col-md-12 p-0">
            <div
                class="login-image"
                style="background-image: url(images/login-bg.jpg);"
            >
                <img src="images/login-bg.jpg" alt="image">
            </div>
        </div>
        <div class="col-lg-6 col-md-12 p-0">
            <div class="login-content">
                <div class="d-table">
                    <div class="d-table-cell">
                        <div class="login-form">
                            <div
                                class="logo"
                                [class.d-none]="themeService.isDark()"
                            >
                                <a routerLink="/">
                                    <img src="images/elikia-logo.png" alt="image">
                                </a>
                            </div>
                            <div
                                class="logo d-none"
                                [class.d-block]="themeService.isDark()"
                            >
                                <a routerLink="/">
                                    <img src="images/elikia-logo.png" alt="image">
                                </a>
                            </div>
                            <h3>Welcome back</h3>
                            <p>New to Elikia? <a routerLink="/register">Sign up</a></p>
                            <form (ngSubmit)="onLogin()">
                                <div class="form-group">
                                    <input
                                        type="email"
                                        name="email"
                                        placeholder="Your email address"
                                        class="form-control"
                                        [(ngModel)]="email"
                                        required
                                    >
                                </div>
                                <div class="form-group">
                                    <input
                                        type="password"
                                        name="password"
                                        placeholder="Your password"
                                        class="form-control"
                                        [(ngModel)]="password"
                                        required
                                    >
                                </div>
                                <p class="login-error" *ngIf="errorMessage">{{ errorMessage }}</p>
                                <button type="submit">Login</button>
                                <div class="forgot-password">
                                    <a routerLink="/">Forgot Password?</a>
                                </div>
                                <div class="connect-with-social">
                                    <button type="button" class="facebook"><i class='bx bxl-facebook'></i> Connect with Facebook</button>
                                    <button type="button" class="twitter"><i class='bx bxl-twitter'></i> Connect with Twitter</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
